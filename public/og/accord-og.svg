<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .bg     { fill: #F5F1E8; }
      .ink    { fill: #0a0a0a; }
      .accent { fill: #1e3a8a; }
      .muted  { fill: #555555; }
      .faint  { fill: #777777; }
      .rule   { stroke: #c8c8c0; stroke-width: 2; }
      .layer  { fill: #0a0a0a; }
      .display { font-family: 'Zilla Slab', Georgia, serif; font-weight: 700; }
      .serif   { font-family: 'Source Serif 4', Georgia, serif; }
      .sans    { font-family: 'Inter', system-ui, sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="630" />

  <!-- Top rule -->
  <line class="rule" x1="80" y1="80" x2="1120" y2="80" />

  <!-- Eyebrow -->
  <text class="sans accent" x="80" y="125" font-size="18" font-weight="700" letter-spacing="3">
    OPENSLM.AI · OPEN. ACCESSIBLE. CORRECTABLE.
  </text>

  <!-- Brand mark: brackets + 4 layer bars -->
  <g transform="translate(80, 175)">
    <path class="ink" d="M 0 0 H 35 V 14 H 21 V 154 H 35 V 168 H 0 Z" />
    <path class="ink" d="M 168 0 H 133 V 14 H 147 V 154 H 133 V 168 H 168 Z" />
    <rect class="layer" x="42" y="35"  width="91" height="14" />
    <rect class="layer" x="42" y="66"  width="70" height="14" />
    <rect class="layer" x="42" y="97"  width="49" height="14" />
    <rect class="layer" x="42" y="128" width="28" height="14" />
  </g>

  <!-- Title -->
  <text class="display ink" x="295" y="240" font-size="84">The Open Small</text>
  <text class="display ink" x="295" y="320" font-size="84">Models Accord</text>

  <!-- Subtitle -->
  <text class="serif muted" x="80" y="412" font-size="26" font-style="italic">
    On open, accessible, and correctable AI for the next decade.
  </text>

  <!-- LWD-R layer marks -->
  <g transform="translate(80, 470)">
    <g>
      <rect class="ink" x="0" y="0" width="38" height="38" />
      <text class="display" x="19" y="28" font-size="21" text-anchor="middle" fill="#F5F1E8">L</text>
      <text class="sans muted" x="48" y="25" font-size="17" font-weight="600">Logic</text>
    </g>
    <g transform="translate(170, 0)">
      <rect class="ink" x="0" y="0" width="38" height="38" />
      <text class="display" x="19" y="28" font-size="21" text-anchor="middle" fill="#F5F1E8">W</text>
      <text class="sans muted" x="48" y="25" font-size="17" font-weight="600">Weights</text>
    </g>
    <g transform="translate(360, 0)">
      <rect class="ink" x="0" y="0" width="38" height="38" />
      <text class="display" x="19" y="28" font-size="21" text-anchor="middle" fill="#F5F1E8">D</text>
      <text class="sans muted" x="48" y="25" font-size="17" font-weight="600">Data</text>
    </g>
    <g transform="translate(510, 0)">
      <rect class="ink" x="0" y="0" width="38" height="38" />
      <text class="display" x="19" y="28" font-size="21" text-anchor="middle" fill="#F5F1E8">R</text>
      <text class="sans muted" x="48" y="25" font-size="17" font-weight="600">Representation</text>
    </g>
  </g>

  <!-- Version stamp (top-right corner, aligned with eyebrow row) -->
  <g transform="translate(1010, 95)">
    <circle cx="55" cy="55" r="54" fill="none" stroke="#1e3a8a" stroke-width="1.5" />
    <circle cx="55" cy="55" r="42" fill="none" stroke="#1e3a8a" stroke-width="1" />
    <text class="sans accent" x="55" y="42" font-size="8" font-weight="700" letter-spacing="2" text-anchor="middle">VERSION</text>
    <text class="display ink" x="55" y="68" font-size="26" text-anchor="middle">v0.2</text>
    <text class="sans faint" x="55" y="84" font-size="9" font-weight="600" letter-spacing="2" text-anchor="middle">DRAFT</text>
  </g>

  <!-- Footer rule + meta -->
  <line class="rule" x1="80" y1="565" x2="1120" y2="565" />
  <text class="sans faint" x="80" y="595" font-size="15" font-weight="600" letter-spacing="1">
    openslm.ai/accord
  </text>
  <text class="sans faint" x="1120" y="595" font-size="15" font-weight="600" letter-spacing="1" text-anchor="end">
    Issued 25 April 2026 · CC0 1.0
  </text>
</svg>
